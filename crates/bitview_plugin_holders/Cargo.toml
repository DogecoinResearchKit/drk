[package]
name = "bitview_plugin_holders"
description = "Overlapping holder cohorts (all, STH, LTH, age cuts) aggregated from UTXO age ranges"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[features]
dogecoin = ["bitview_cohort/dogecoin", "bitview_compute/dogecoin", "bitview_distribution/dogecoin", "bitview_plugin/dogecoin", "bitview_plugin_age/dogecoin", "bitview_plugin_mappings/dogecoin", "bitview_plugin_price/dogecoin", "bitview_primitives/dogecoin", "bitview_traversable/dogecoin", "bitview_vecs/dogecoin", "brk_error/dogecoin", "brk_types/dogecoin"]

[dependencies]
bitview_cohort = { workspace = true, features = ["storage"] }
bitview_compute = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_age = { workspace = true }
bitview_distribution = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_price = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_traversable = { workspace = true }
bitview_vecs = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
brk_exit = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
derive_more = { workspace = true }
statedb = { workspace = true }
vecdb = { workspace = true }
