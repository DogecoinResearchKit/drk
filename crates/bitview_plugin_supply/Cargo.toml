[package]
name = "bitview_plugin_supply"
description = "Bitcoin circulating and burned supply, market cap, inflation and velocity datasets for Bitview"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[features]
dogecoin = ["bitview_distribution/dogecoin", "bitview_plugin/dogecoin", "bitview_plugin_holders/dogecoin", "bitview_plugin_indexer/dogecoin", "bitview_plugin_mappings/dogecoin", "bitview_plugin_mining/dogecoin", "bitview_plugin_outputs/dogecoin", "bitview_plugin_price/dogecoin", "bitview_plugin_transactions/dogecoin", "bitview_primitives/dogecoin", "bitview_traversable/dogecoin", "bitview_vecs/dogecoin", "brk_error/dogecoin", "brk_types/dogecoin"]

[dependencies]
bitview_distribution = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_vecs = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_holders = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_mining = { workspace = true }
bitview_plugin_outputs = { workspace = true }
bitview_plugin_price = { workspace = true }
bitview_plugin_transactions = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
bitview_plugin_indexer = { workspace = true }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
vecdb = { workspace = true }
