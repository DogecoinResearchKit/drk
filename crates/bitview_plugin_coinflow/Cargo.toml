[package]
name = "bitview_plugin_coinflow"
description = "Bitcoin spending-hazard estimates and mobility-weighted cohort metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[features]
dogecoin = ["bitview_cohort/dogecoin", "bitview_compute/dogecoin", "bitview_distribution/dogecoin", "bitview_plugin/dogecoin", "bitview_plugin_age/dogecoin", "bitview_plugin_indexer/dogecoin", "bitview_plugin_mappings/dogecoin", "bitview_plugin_price/dogecoin", "bitview_primitives/dogecoin", "bitview_traversable/dogecoin", "bitview_urpd/dogecoin", "bitview_vecs/dogecoin", "brk_error/dogecoin", "brk_types/dogecoin"]

[dependencies]
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_urpd = { workspace = true }
bitview_vecs = { workspace = true }
brk_exit = { workspace = true }
bitview_compute = { workspace = true }
bitview_distribution = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_age = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_price = { workspace = true }
bitview_cohort = { workspace = true, features = ["storage"] }
brk_error = { workspace = true, features = ["vecdb"] }
bitview_plugin_indexer = { workspace = true }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
rayon = { workspace = true }
vecdb = { workspace = true }
