[package]
name = "bitview_plugin_pools"
description = "Bitcoin mining-pool attribution, rewards and hash rate datasets for Bitview"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage = "https://bitview.dev"
repository.workspace = true

[features]
dogecoin = ["bitview_compute/dogecoin", "bitview_plugin/dogecoin", "bitview_plugin_indexer/dogecoin", "bitview_plugin_mappings/dogecoin", "bitview_plugin_mining/dogecoin", "bitview_primitives/dogecoin", "bitview_traversable/dogecoin", "bitview_vecs/dogecoin", "brk_error/dogecoin", "brk_types/dogecoin"]

[dependencies]
arc-swap = { workspace = true }
bitview_primitives = { workspace = true, features = ["storage"] }
bitview_compute = { workspace = true }
bitview_vecs = { workspace = true }
brk_exit = { workspace = true }
bitview_plugin = { workspace = true }
bitview_plugin_mappings = { workspace = true }
bitview_plugin_mining = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
bitview_plugin_indexer = { workspace = true }
bitview_traversable = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
rangeindex = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
vecdb = { workspace = true }
