[package]
name = "bitview_urpd"
description = "Shared UTXO price distribution calculations and metric storage"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
dogecoin = ["bitview_cohort/dogecoin", "bitview_compute/dogecoin", "bitview_primitives/dogecoin", "bitview_traversable/dogecoin", "bitview_vecs/dogecoin", "brk_error/dogecoin", "brk_types/dogecoin"]

[dependencies]
bitview_primitives = { workspace = true, features = ["storage"] }
statedb = { workspace = true }
bitview_compute = { workspace = true }
bitview_cohort = { workspace = true, features = ["storage"] }
bitview_traversable = { workspace = true }
bitview_vecs = { workspace = true }
brk_error = { workspace = true, features = ["vecdb"] }
brk_exit = { workspace = true }
brk_types = { workspace = true, features = ["storage"] }
rayon = { workspace = true }
rustc-hash = { workspace = true }
vecdb = { workspace = true }
