[package]
name = "bitviewd_bench"
description = "End-to-end bootstrap benchmark for bitviewd."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
dogecoin = ["bitview/dogecoin", "bitview_default/dogecoin", "brk_error/dogecoin", "brk_reader/dogecoin", "brk_types/dogecoin"]

[dependencies]
brk_alloc = { workspace = true }
vecdb = { workspace = true }
brk_exit = { workspace = true }
bitview = { workspace = true }
bitview_default = { workspace = true }
brk_error = { workspace = true }
brk_logger = { workspace = true }
brk_reader = { workspace = true }
brk_types = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
