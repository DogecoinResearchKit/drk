name: brk

# Environment variables (set in a .env file or shell):
#
# Dogecoin (default for this fork):
#   CHAIN_DATA_DIR  — path to dogecoin data directory  (default: /path/to/dogecoin)
#   RPC_HOST        — dogecoind RPC host               (default: localhost)
#   RPC_USER        — dogecoind RPC user               (default: dogecoin)
#   RPC_PASSWORD    — dogecoind RPC password           (default: dogecoin)
#   CHAIN           — "dogecoin" or "bitcoin"          (default: dogecoin)
#
# Bitcoin: set CHAIN=bitcoin plus the matching CHAIN_DATA_DIR/RPC_* values.
# (Note: the image is built with the `dogecoin` feature, which selects the
#  AuxPoW-aware block decoder; a Bitcoin node still works with CHAIN=bitcoin.)

services:
  brk:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: brk:latest
    container_name: brk
    restart: unless-stopped
    ports:
      - 7070:3110
    volumes:
      - ${CHAIN_DATA_DIR:-/path/to/dogecoin}:/chaindata:ro
      - ${BRK_DATA_DIR:-./brk-data}:/home/brk/.brk
    command:
      - --chaindir
      - /chaindata
      - --blocksdir
      - /chaindata/blocks
      - --brkdir
      - /home/brk/.brk
      - --chain
      - "${CHAIN:-dogecoin}"
      - --rpcconnect
      - "${RPC_HOST:-localhost}"
      - --rpcuser
      - "${RPC_USER:-dogecoin}"
      - --rpcpassword
      - "${RPC_PASSWORD:-dogecoin}"
      # Cookie file alternative (uncomment and remove rpcuser/rpcpassword above):
      # - --rpccookiefile
      # - /chaindata/.cookie
    healthcheck:
      test: ["CMD", "pgrep", "-x", "brk"]
      interval: 30s
      retries: 3
      start_period: 10s

volumes:
  brk-data:
    driver: local
